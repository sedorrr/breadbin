# Baut Breadbin für Windows, macOS (Apple Silicon und Intel) und Linux.
# Start: von Hand („Run workflow“) oder durch ein Tag v* (dann zusätzlich ein Release-Entwurf).
#
# Repository-Secrets (optional, sonst müssen Nutzer die Kennung selbst eintragen):
#   SCREENSCRAPER_DEVID, SCREENSCRAPER_DEVPASSWORD
name: Pakete bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            pakete: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            pakete: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          # 22.04: ältere glibc, damit die Pakete auch auf älteren Distributionen laufen.
          - os: ubuntu-22.04
            name: linux
            pakete: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken für Tauri
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Tauri-CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests
        run: cargo test -p breadbin-core

      # Feste Signatur für macOS (optional): Mit einem eigenen (auch selbstsignierten) Zertifikat bleiben Schlüsselbund-
      # Eintrag und Freigabe „Lokales Netzwerk“ über Updates erhalten; ad hoc signierte Pakete verlieren sie bei jedem
      # Update. Secrets: MACOS_CERTIFICATE (p12, base64), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY (Name).
      - name: macOS-Signatur (optional)
        if: matrix.name == 'macos'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CERT_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        # Wie beim lokalen Bau: eigener Schlüsselbund mit vertrautem Zertifikat, Tauri bekommt nur den Namen
        # (APPLE_SIGNING_IDENTITY). Mit APPLE_CERTIFICATE importiert Tauri selbst und findet die selbstsignierte
        # Identität nicht („failed to resolve signing identity“).
        run: SETZE_ENV=1 bash .github/macos-signatur.sh

      - name: Bauen
        working-directory: src-tauri
        env:
          SCREENSCRAPER_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SCREENSCRAPER_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            # Das DMG-Werkzeug von Tauri steuert den Finder fern (scheitert ohne Oberfläche):
            # nur das .app bauen und das DMG schlicht mit hdiutil erzeugen.
            cargo tauri build --target universal-apple-darwin --bundles app
            cd ../target/universal-apple-darwin/release/bundle
            mkdir -p dmg inhalt
            cp -R macos/Breadbin.app inhalt/
            ln -s /Applications inhalt/Programme
            # Erklärt, wie man die nicht notarisierte App beim ersten Start trotzdem öffnet.
            cp "../../../../packaging/macos/Zuerst lesen - Read me first.txt" inhalt/
            version=$(grep -m1 '"version"' ../../../../src-tauri/tauri.conf.json | cut -d'"' -f4)
            hdiutil create -volname Breadbin -srcfolder inhalt -ov -format UDZO "dmg/Breadbin_${version}_universal.dmg"
          else
            cargo tauri build
          fi

      # ZIP-Artefakte verlieren das Ausführbar-Bit: macOS als DMG, Linux als AppImage/deb/rpm.
      - uses: actions/upload-artifact@v4
        with:
          name: breadbin-${{ matrix.name }}
          path: ${{ matrix.pakete }}
          retention-days: 7

      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.pakete }}
