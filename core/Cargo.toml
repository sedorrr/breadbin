[package]
name = "breadbin-core"
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
md-5 = "0.11.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
ureq = "3.5.0"
walkdir = "2.5.0"
zip = "9.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
