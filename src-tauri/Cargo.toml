[package]
name = "breadbin"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Verwaltet C64-Spiele aus lokalen Ordnern, Netzlaufwerken und Ultimate-Geräten"
homepage = "https://8bitcavern.de"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
breadbin-core = { path = "../core" }
keyring = "4.2.0"
rusqlite = "0.41"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
